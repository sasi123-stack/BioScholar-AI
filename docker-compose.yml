version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: biomedical-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9201:9200"
    volumes:
      - ./docker/elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - biomedical-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: biomedical-redis
    ports:
      - "6380:6379"
    volumes:
      - ./docker/redis-data:/data
    networks:
      - biomedical-network

  postgres:
    image: postgres:15-alpine
    container_name: biomedical-postgres
    environment:
      POSTGRES_DB: biomedical_search
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    networks:
      - biomedical-network

  backend:
    build: .
    container_name: biomedical-backend
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=changeme
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://user:password@postgres:5432/biomedical_search
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8000:7860"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - biomedical-network

  frontend:
    image: nginx:alpine
    container_name: biomedical-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - biomedical-network

networks:
  biomedical-network:
    driver: bridge
